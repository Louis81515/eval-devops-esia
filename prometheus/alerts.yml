groups:
  - name: devops-eval-api
    rules:
      - alert: HighErrorRate5xx
        expr: |
          sum(rate(http_requests_total{code=~"5.."}[5m]))
          /
          sum(rate(http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreurs 5xx élevé sur devops-eval-api"
          description: >-
            Plus de 5% des requêtes renvoient une erreur 5xx depuis 5 minutes
            (ratio erreurs/total calculé sur une fenêtre glissante de 5m).

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)
          )
          > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 dégradée sur {{ $labels.route }}"
          description: >-
            Le temps de réponse p95 de la route {{ $labels.route }} dépasse
            500 ms depuis 10 minutes.
