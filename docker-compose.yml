services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    # Image par défaut locale ; le CD surcharge APP_IMAGE avec l'image ghcr
    # exacte (nom du repo GitHub + tag) lors du pull et du rollback.
    image: ${APP_IMAGE:-devops-eval-api:local}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/appdb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Interroge réellement /health (qui vérifie aussi PostgreSQL).
      test:
        - CMD-SHELL
        - >-
          python -c "import sys,urllib.request;
          r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2);
          sys.exit(0 if r.status==200 else 1)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
